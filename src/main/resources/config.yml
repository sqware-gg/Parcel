# Parcel
# Paste your Parcel API token from https://sqware.gg/dashboard-store.
# Server owners must list their server on https://sqware.gg first.
# Parcel connects to the SQWARE API origin at https://api.sqware.gg.
api-token: ""

# Set to true to log delivery attempts to the server console.
debug: false

# When a delivery needs the player online, Parcel queues it locally and
# executes it this many seconds after the player joins.
join-delivery-delay-seconds: 2

# How Parcel resolves player identity for online deliveries.
# uuid: use the queued UUID first, then the queued name. This is the default
#       and preserves the regular online-mode setup.
# name: ignore the queued UUID for matching, wait for a player whose in-game
#       name matches playerName, then render UUID placeholders from that live
#       server player. Use this for offline-mode/proxy/Geyser setups.
delivery-identity: uuid
